          doItem('Match the place: GP office (Noida), Accounting Doctors (Raipur), BCPL godown (Muzaffarpur), ECPL office (Bangalore).')),
        R('div',{ style:{ background:'rgba(192,57,43,.10)', border:'1px solid rgba(192,57,43,.35)', borderRadius:16, padding:'24px 26px' } },
          R('div',{ style:{ color:S.red, fontWeight:800, fontSize:17, marginBottom:16, letterSpacing:'.04em' } }, "DON'T"),
          dontItem('No detailed or realistic scenery — this is flat-vector, not a render.'),
          dontItem('No busy patterns, textures or gradients behind text panels.'),
          dontItem('No high-saturation backgrounds that fight the character colours.'),
          dontItem('Never place a speech bubble or number panel over a busy prop cluster.'))
      ),
      // location swatches
      R('div',{ style:{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:16 } },
        [['Godown','#e9eaf2','BCPL · Muzaffarpur'],['Office','#fdf8f3','GP / Doctors'],['ECPL Floor','#eef3fb','Bangalore'],['Spotlight','#1A1A2E','Concept / recap']].map((b,k)=>
          R('div',{ key:k, style:{ borderRadius:12, overflow:'hidden', border:'1px solid rgba(255,255,255,.1)' } },
            R('div',{ style:{ height:60, background:b[1] } }),
            R('div',{ style:{ background:'rgba(255,255,255,.04)', padding:'10px 12px' } },
              R('div',{ style:{ fontSize:14, fontWeight:800, color:'#fff' } }, b[0]),
              R('div',{ style:{ fontSize:11.5, color:'#9a95a8', marginTop:2 } }, b[2])))))
    );

    const footer = R('div',{ style:{ textAlign:'center', padding:'56px 0 20px', color:'#5f5b6e', fontSize:13, letterSpacing:'.05em' } },
      'CA Inter · Advanced Accounting    ·    #pranavBhaiya  #NewtonofAccounts    ·    VC Gurukul, Noida');

    const page = R('div',{ style:{ width:'100%', maxWidth:W, margin:'0 auto', padding:'48px 28px 0' } }, header, eco, grid, icai, bg, footer);

    return { app: R('div',{ style:{ minHeight:'100vh', background:'radial-gradient(circle at 50% 0%, #1c1c2b, #0d0d14 60%)', paddingBottom:20 } }, page) };
  }
}
