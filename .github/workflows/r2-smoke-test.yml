name: R2 Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/r2-smoke-test.yml"

permissions:
  contents: read

jobs:
  r2-smoke-test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Validate required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret/environment value: $name"
              exit 1
            fi
          done

      - name: Test R2 write read delete
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="_pipeline-smoke-tests/github-actions-${GITHUB_RUN_ID}.txt"
          printf 'cap-online R2 smoke test: %s\n' "${GITHUB_RUN_ID}" > /tmp/r2-smoke.txt
          aws s3api head-bucket --bucket "${R2_BUCKET_NAME}" --endpoint-url "${ENDPOINT}"
          aws s3 cp /tmp/r2-smoke.txt "s3://${R2_BUCKET_NAME}/${KEY}" --endpoint-url "${ENDPOINT}" --only-show-errors
          aws s3 cp "s3://${R2_BUCKET_NAME}/${KEY}" /tmp/r2-smoke-roundtrip.txt --endpoint-url "${ENDPOINT}" --only-show-errors
          cmp /tmp/r2-smoke.txt /tmp/r2-smoke-roundtrip.txt
          aws s3 rm "s3://${R2_BUCKET_NAME}/${KEY}" --endpoint-url "${ENDPOINT}" --only-show-errors
          echo "R2_SMOKE_TEST_OK"
