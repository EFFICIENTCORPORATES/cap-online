*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0d0d14;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);overflow:hidden}button,select{font:inherit}.app{position:fixed;inset:0;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 50% 35%,#202035,#0d0d14)}.frame{position:relative;width:min(1280px,calc(100vw - 24px));aspect-ratio:16/9;max-height:calc(100vh - 24px);overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:var(--paper);box-shadow:0 30px 80px rgba(0,0,0,.5)}.progress{position:absolute;z-index:20;left:0;right:0;top:0;height:5px;background:rgba(26,26,46,.1)}.progress i{display:block;height:100%;background:var(--orange);transition:width .35s}.topline{position:absolute;z-index:15;left:20px;right:20px;top:14px;display:flex;justify-content:space-between;gap:20px;color:rgba(26,26,46,.55);font-size:12px;font-weight:700}.stage{position:absolute;inset:0;padding:70px 54px 100px;background:linear-gradient(140deg,#fdf8f3,#eef2f7);overflow:hidden}.stage:before{content:"";position:absolute;width:420px;height:420px;right:-180px;top:-170px;border:1px solid rgba(26,26,46,.08);border-radius:50%;box-shadow:0 0 0 55px rgba(26,26,46,.025),0 0 0 110px rgba(26,26,46,.02)}.scene-copy{position:relative;z-index:4;max-width:680px}.scene-kicker{margin:0 0 12px;color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.scene-copy h1{margin:0;font-size:clamp(34px,5vw,70px);line-height:.98;letter-spacing:-.055em}.scene-caption{max-width:650px;margin:20px 0 0;color:#4b5563;font-size:clamp(14px,1.5vw,20px);line-height:1.55}.visual{position:absolute;z-index:3;right:55px;top:165px;width:430px;min-height:225px;display:grid;place-items:center;padding:25px;border:1px solid rgba(26,26,46,.12);border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 18px 45px rgba(26,26,46,.12);animation:pop .4s ease}.visual strong{display:block;color:var(--orange);font-size:clamp(24px,3.4vw,47px);line-height:1;text-align:center}.visual span{display:block;margin-top:12px;color:#555f70;font-size:15px;line-height:1.45;text-align:center}.visual .flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.visual .flow b{padding:12px;border-radius:8px;background:#eef2f7;font-size:12px}.visual .flow i{color:var(--orange);font-style:normal;font-weight:900}.cast{position:absolute;z-index:5;left:45px;right:45px;bottom:52px;height:235px;pointer-events:none}.character{position:absolute;bottom:0;width:145px;height:225px;text-align:center;animation:rise .42s ease}.character svg{width:128px;height:192px;filter:drop-shadow(0 8px 10px rgba(26,26,46,.14))}.character label{display:inline-block;margin-top:-5px;padding:4px 13px;border-radius:20px;background:var(--navy);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em}.character.c0{left:0}.character.c1{left:155px}.character.c2{left:310px}.narration{position:absolute;z-index:12;left:50%;bottom:25px;width:min(810px,65%);transform:translateX(-38%);padding:14px 20px;border-radius:12px;background:rgba(26,26,46,.94);color:#fff;box-shadow:0 8px 25px rgba(26,26,46,.23)}.narration small{display:block;margin-bottom:5px;color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.narration p{margin:0;font-size:13px;line-height:1.45}.controls{position:absolute;z-index:30;right:16px;top:40px;display:flex;align-items:end;gap:6px;padding:8px;border-radius:11px;background:rgba(13,13,20,.9);color:#fff}.controls label{display:grid;gap:3px;color:#b9c2cf;font-size:8px;font-weight:800;text-transform:uppercase}.controls select,.controls button{height:30px;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:#29293c;color:#fff;font-size:10px}.controls select{max-width:132px;padding:0 7px}.controls button{padding:0 10px;background:var(--orange);font-weight:800;cursor:pointer}.controls .voice-name{max-width:105px;color:#adb7c6;font-size:8px;line-height:1.25}.nav{position:absolute;z-index:25;left:16px;bottom:15px;display:flex;gap:6px}.nav button{padding:7px 11px;border:1px solid rgba(26,26,46,.18);border-radius:7px;background:#fff;color:var(--ink);font-size:10px;font-weight:800;cursor:pointer}.lesson{position:absolute;z-index:8;right:23px;bottom:20px;color:rgba(26,26,46,.5);font-size:10px;font-weight:700}.playing .character svg{animation:breathe 2.2s ease-in-out infinite}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes breathe{50%{transform:translateY(-4px)}}@media(max-width:850px){.controls{left:10px;right:10px;top:38px;overflow:auto}.controls .voice-name{display:none}.stage{padding:105px 24px 140px}.scene-copy{max-width:100%}.scene-copy h1{font-size:40px}.scene-caption{font-size:14px}.visual{left:24px;right:24px;top:275px;width:auto;min-height:145px}.cast{left:10px;bottom:64px;transform:scale(.72);transform-origin:bottom left}.narration{left:12px;right:12px;bottom:48px;width:auto;transform:none}.narration p{font-size:11px}.lesson{display:none}}@media(max-width:620px){.frame{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border-radius:0}.controls label:nth-child(2){display:none}.controls select{max-width:115px}.stage{padding-top:100px}.visual{top:290px}.cast{opacity:.85}.narration{bottom:50px}.nav{bottom:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const STORIES={
"2":{name:"AS 2 · The Naphthalene Factory",scenes:[
{k:"Scene 1 · The factory",t:"What exactly is inventory?",c:"BCPL manufactures naphthalene balls. Rolly begins by listing everything she can see.",v:["Factory","Raw chemical → Processing → Packed balls"],cast:["rolly","sethji"],en:"Let us enter Sethji’s naphthalene factory at year end. Rolly can see chemicals, unfinished material, packed boxes, machinery and the factory building. The first lesson is not valuation—it is classification. We must first ask why each item is held and what role it performs.",hi:"साल के अंत में हम सेठजी की नैफ्थलीन फैक्ट्री में आते हैं। रॉली को केमिकल, अधबना माल, पैक डिब्बे, मशीन और बिल्डिंग सब दिखाई देते हैं। पहला प्रश्न वैल्यू का नहीं, classification का है—हर वस्तु किस उद्देश्य से रखी गई है?"},
{k:"Scene 2 · Three inventory stages",t:"Raw material, WIP and finished goods",c:"The same production cycle creates three different forms of inventory.",v:["Inventory cycle","Chemical → Work in progress → Finished naphthalene balls"],cast:["rolly","pranav"],en:"Pranav separates the production flow into three stages. The chemical waiting to enter production is raw material. Material currently inside the process is work in progress. Completed naphthalene balls ready for sale are finished goods. All three are inventory because they will be sold or consumed in producing goods for sale.",hi:"प्रणव उत्पादन प्रक्रिया को तीन भागों में बाँटते हैं। उत्पादन से पहले का केमिकल raw material है, प्रक्रिया के बीच का माल work in progress है और बिक्री के लिए तैयार नैफ्थलीन बॉल finished goods हैं। तीनों inventory हैं क्योंकि वे बिक्री या उत्पादन के लिए रखे गए हैं।"},
{k:"Scene 3 · The boundary",t:"Not everything in the factory is inventory",c:"Machinery and the building help production, but they are not consumed as inventory.",v:["Separate the assets","Inventory: chemicals, packing, finished goods","AS 10: machine and factory building"],cast:["pranav","rolly"],en:"This is the boundary students often miss. The machine and factory building help create inventory, but the business is not holding them for sale and they are not consumed in one production cycle. They are property, plant and equipment under AS 10. Packing material used for the finished product, however, forms part of inventory cost.",hi:"यही वह सीमा है जहाँ विद्यार्थी गलती करते हैं। मशीन और फैक्ट्री बिल्डिंग उत्पादन में मदद करती हैं, लेकिन वे बिक्री के लिए नहीं हैं और एक production cycle में consume नहीं होतीं। इसलिए वे AS 10 के assets हैं। Finished product की packing material inventory cost का हिस्सा बन सकती है।"},
{k:"Scene 4 · Purchase cost",t:"What enters the cost of chemical?",c:"Start from purchase price and bring the material to its present location and condition.",v:["Purchase cost","Price + non-refundable duties + freight","Less: trade discounts and rebates"],cast:["pranav"],en:"Now valuation begins. The cost of the raw chemical starts with its purchase price. Add non-refundable duties, inward freight and costs directly needed to bring it to the factory. Remove trade discounts and rebates. Recoverable taxes do not become inventory cost because the entity can claim them back.",hi:"अब valuation शुरू होती है। Raw chemical की cost purchase price से शुरू होगी। Non-refundable duty, inward freight और factory तक लाने की direct cost जोड़ेंगे। Trade discount और rebate घटेंगे। Recoverable tax inventory cost नहीं बनेगा क्योंकि उसका credit मिल सकता है।"},
{k:"Scene 5 · Conversion",t:"Turning chemical into naphthalene balls",c:"Direct labour and production overhead convert material into finished inventory.",v:["Conversion cost","Direct labour + variable production overhead","Fixed overhead at normal capacity"],cast:["diya","pranav"],en:"Inside the factory, chemical becomes naphthalene balls through labour, power and production facilities. Direct labour and variable production overhead follow actual production. Fixed production overhead is allocated using normal capacity, not simply divided by an abnormally low number of units. This prevents idle-capacity cost from inflating inventory.",hi:"फैक्ट्री में labour, power और production facilities के कारण chemical finished balls बनता है। Direct labour और variable overhead actual production के अनुसार आते हैं। Fixed production overhead normal capacity पर allocate होगा, ताकि कम उत्पादन के कारण inventory की cost कृत्रिम रूप से बढ़ न जाए।"},
{k:"Scene 6 · Exclusions",t:"Some expenditure belongs to the period",c:"Abnormal waste, avoidable storage and selling costs do not create inventory.",v:["Expense, do not load","Abnormal loss · unnecessary storage · selling cost"],cast:["rolly","pranav"],en:"Rolly tries to load every factory expense into closing stock because it improves profit. Pranav stops her. Abnormal wastage, avoidable storage, unrelated administration and selling or distribution costs do not bring inventory to its present location and condition. They are period expenses, not a way to hide inefficiency inside stock.",hi:"रॉली हर खर्च closing stock में डालना चाहती है, क्योंकि इससे profit बढ़ता दिखाई देगा। प्रणव रोकते हैं। Abnormal wastage, avoidable storage, unrelated administration और selling cost inventory को present condition में नहीं लाते। इसलिए वे period expense हैं।"},
{k:"Scene 7 · Damaged batch",t:"Cost is ₹100, but can it realise ₹100?",c:"A batch absorbed moisture and needs repacking before sale.",v:["NRV working","Selling price ₹92 − repacking ₹5 = NRV ₹87","Cost ₹100 → value ₹87"],cast:["sethji","pranav"],en:"A damaged batch cost one hundred rupees per box. Because of moisture, it can sell for only ninety-two, and repacking will cost five. Net realisable value is therefore eighty-seven. AS 2 does not wait for the loss to become a sale. The box is written down from cost of one hundred to NRV of eighty-seven.",hi:"एक damaged batch की cost सौ रुपये प्रति बॉक्स है। Moisture के कारण selling price केवल बानवे है और repacking में पाँच रुपये लगेंगे। इसलिए NRV सतासी है। AS 2 loss को sale तक postpone नहीं करता; inventory सौ से घटाकर सतासी पर दिखाई जाएगी।"},
{k:"Scene 8 · Prudence",t:"Lower of cost and NRV",c:"Expected loss is recognised; unrealised profit is not anticipated.",v:["The rule","Lower of cost and net realisable value","Anticipate no profit · provide expected loss"],cast:["pranav","sethji"],en:"Now the principle becomes clear. If NRV is above cost, inventory stays at cost because the higher amount would recognise profit before sale. If NRV falls below cost, the expected loss is recognised immediately. Lower of cost and NRV is prudence expressed as a measurement rule.",hi:"अब principle स्पष्ट है। यदि NRV cost से अधिक है तो inventory cost पर ही रहेगी, क्योंकि higher value sale से पहले profit दिखा देगी। यदि NRV cost से कम है तो expected loss तुरंत recognise होगा। Lower of cost and NRV, prudence का measurement rule है।"},
{k:"Scene 9 · Cost formula",t:"Which batch was consumed first?",c:"Interchangeable items require a consistent cost formula.",v:["Permitted formulas","FIFO or weighted average","Choose appropriately and apply consistently"],cast:["rolly","pranav"],en:"Naphthalene boxes from different purchase lots are ordinarily interchangeable. AS 2 permits FIFO or weighted average for such items. The formula changes the assignment of cost, not the physical truth of the goods. Select an appropriate formula and apply it consistently; do not switch merely to obtain a preferred profit.",hi:"अलग purchase lots के naphthalene boxes सामान्यतः interchangeable हैं। ऐसे items के लिए FIFO या weighted average उपयोग किया जा सकता है। Formula cost assignment बदलता है, goods की reality नहीं। उचित method चुनकर consistently apply करना है, profit बदलने के लिए switch नहीं करना है।"},
{k:"Final recap",t:"The factory story in one chain",c:"Classify → build cost → exclude period loss → compare with NRV → apply cost formula.",v:["AS 2 decision chain","Inventory? → Cost? → NRV? → Lower amount → Consistent formula"],cast:["pranav","rolly","sethji"],en:"The entire story is one decision chain. First classify the item. Then build only the cost that brings inventory to its present location and condition. Expense abnormal and selling costs. Compare cost with NRV item by item, take the lower amount, and use the selected cost formula consistently. That is how the factory gives a true inventory figure.",hi:"पूरी कहानी एक decision chain है। पहले item को classify करें। फिर केवल वही cost जोड़ें जो inventory को present location and condition तक लाती है। Abnormal और selling costs expense करें। Cost और NRV की तुलना करके lower amount लें और cost formula consistently apply करें।"}]},
"10":{name:"AS 10 · The New Moulding Machine",scenes:[
{k:"Scene 1 · Expansion",t:"Sethji orders a new machine",c:"BCPL needs higher capacity for its naphthalene line.",v:["Business decision","New automatic moulding machine"],cast:["sethji","diya"],en:"Demand has increased, so Sethji orders an automatic moulding machine. Diya is ready to debit every rupee connected with the project to machinery. Pranav explains that AS 10 begins with recognition and then asks which expenditure is necessary to bring the asset to working condition.",hi:"Demand बढ़ने पर सेठजी automatic moulding machine खरीदते हैं। दिया project से जुड़े हर रुपये को machinery में debit करना चाहती हैं। प्रणव बताते हैं कि AS 10 पहले recognition देखता है और फिर पूछता है कि asset को working condition तक लाने के लिए कौन सा expenditure आवश्यक था।"},
{k:"Scene 2 · Recognition",t:"When does PPE enter the books?",c:"Future economic benefits must be probable and cost reliably measurable.",v:["Recognition test","Probable benefits + reliable measurement"],cast:["pranav","diya"],en:"The machine will produce goods over several periods, so future economic benefits are probable. The invoice and directly attributable costs can be measured reliably. Both conditions are satisfied, so the machine qualifies for recognition as property, plant and equipment.",hi:"Machine कई periods तक goods produce करेगी, इसलिए future economic benefits probable हैं। Invoice और directly attributable costs reliably measure हो सकती हैं। दोनों conditions पूरी होने पर machine property, plant and equipment के रूप में recognise होगी।"},
{k:"Scene 3 · Initial cost",t:"Bring the machine to working condition",c:"Invoice, freight, site preparation, installation and testing form the cost.",v:["Capitalise","Purchase ₹20 lakh + freight ₹1 lakh + installation ₹2 lakh","Initial cost ₹23 lakh"],cast:["rolly","pranav"],en:"The purchase price is not the entire cost. Freight brings the machine to the factory. Site preparation and installation make it capable of operating. Testing confirms that it works as intended, after adjusting proceeds from test output according to the applicable treatment. These directly attributable amounts form initial cost.",hi:"Purchase price ही पूरी cost नहीं है। Freight machine को factory तक लाता है। Site preparation और installation उसे operate करने योग्य बनाते हैं। Testing यह confirm करती है कि machine intended manner में काम करती है। ये directly attributable amounts initial cost में शामिल होंगे।"},
{k:"Scene 4 · What stays outside",t:"Not every launch expense is an asset",c:"Training, inauguration and general administration are expensed.",v:["Expense","Staff training · opening ceremony · general overhead"],cast:["diya","pranav"],en:"Management training is useful, but it does not bring the machine itself to working condition. The inauguration event and general office overhead are even further removed. AS 10 prevents these operating and promotional costs from being parked inside the asset. They are recognised as expenses when incurred.",hi:"Staff training उपयोगी है, लेकिन वह machine को working condition में नहीं लाती। Inauguration और general office overhead भी asset creation से अलग हैं। AS 10 इन operating और promotional costs को asset में छिपाने नहीं देता; उन्हें incurred होने पर expense किया जाएगा।"},
{k:"Scene 5 · Available for use",t:"Depreciation starts before full production",c:"The machine is ready on 1 October, even though regular production starts later.",v:["Depreciation trigger","Available for use: 1 October","Not: date of full commercial output"],cast:["rolly","pranav"],en:"The machine is installed and ready on first October, but the factory runs it lightly until November. Depreciation begins when the asset is available for use, not when management achieves its desired production level. The accounting follows readiness of the asset, not business convenience.",hi:"Machine पहली October को install होकर use के लिए ready है, लेकिन full production November में शुरू होता है। Depreciation available-for-use date से शुरू होगा, desired production date से नहीं। Accounting asset की readiness देखता है, management की convenience नहीं।"},
{k:"Scene 6 · Components",t:"One machine can contain different useful lives",c:"A major furnace component wears out earlier than the main body.",v:["Component accounting","Significant parts depreciated separately"],cast:["pranav","diya"],en:"The moulding machine includes a heating unit that requires replacement much earlier than the main frame. When a component is significant and has a different useful life, it is depreciated separately. Component accounting makes the charge reflect how economic benefits are actually consumed.",hi:"Moulding machine का heating unit main frame से पहले replace होगा। यदि component significant है और उसकी useful life अलग है तो उसका depreciation अलग होगा। Component accounting depreciation को actual consumption pattern के करीब लाता है।"},
{k:"Scene 7 · Subsequent expenditure",t:"Repair or replacement?",c:"Routine servicing maintains performance; a major replacement creates future benefit.",v:["Decision","Routine repair → expense","Qualifying replacement → capitalise and derecognise old part"],cast:["rolly","pranav"],en:"Routine servicing only maintains the machine, so it is an expense. A major replacement that satisfies recognition criteria is added to the carrying amount. At the same time, the carrying amount of the old component is removed. Otherwise both the old and new parts would remain in the books.",hi:"Routine servicing केवल machine को maintain करती है, इसलिए expense है। Recognition criteria पूरा करने वाला major replacement carrying amount में add होगा। साथ ही पुराने component की carrying amount remove होगी, वरना books में old और new दोनों parts दिखाई देंगे।"},
{k:"Scene 8 · Disposal",t:"The old machine leaves the factory",c:"Compare disposal proceeds with carrying amount.",v:["Derecognition","Sale proceeds − carrying amount = gain or loss"],cast:["sethji","pranav"],en:"When the old machine is sold, its cost and accumulated depreciation leave the books. Sale proceeds are compared with carrying amount, and the difference becomes a gain or loss in profit and loss. The sale price is not revenue from ordinary product sales.",hi:"Old machine बेचने पर उसकी cost और accumulated depreciation books से हटती है। Sale proceeds और carrying amount का difference gain या loss बनता है। यह normal product sale का revenue नहीं है।"},
{k:"Final recap",t:"The life cycle of PPE",c:"Recognise → measure cost → depreciate → review → derecognise.",v:["AS 10 chain","Recognition → initial cost → depreciation → replacement → disposal"],cast:["pranav","diya","sethji"],en:"AS 10 follows the asset from entry to exit. Recognise only when benefits and measurement conditions are met. Include only costs necessary for readiness. Depreciate from available-for-use date, separate significant components, account correctly for replacements, and remove the asset when disposed or no future benefit remains.",hi:"AS 10 asset को entry से exit तक follow करता है। Benefits और measurement conditions पूरी होने पर recognise करें। केवल readiness तक की necessary cost capitalise करें। Available-for-use date से depreciation, significant components का अलग treatment, replacements और disposal सही प्रकार से account करें।"}]},
"22":{name:"AS 22 · Two Profit Stories",scenes:[
{k:"Scene 1 · The confusion",t:"One company, two profit numbers",c:"Book profit and taxable income are prepared under different rules.",v:["March closing","Accounting profit ₹40 lakh","Taxable income ₹32 lakh"],cast:["diya","sethji"],en:"At year end, Diya finds two different profit figures. Sethji thinks one must be wrong. Pranav explains that accounting standards measure financial performance, while tax law computes taxable income. AS 22 does not force the two numbers to match; it accounts for the tax effect of their differences.",hi:"Year end पर दिया को दो अलग profit figures मिलते हैं। सेठजी को लगता है कि एक गलत है। प्रणव समझाते हैं कि accounting standards financial performance measure करते हैं, जबकि tax law taxable income निकालता है। AS 22 differences के tax effect को account करता है।"},
{k:"Scene 2 · Permanent difference",t:"Some differences never reverse",c:"A permanently disallowed expense affects accounting profit but never receives tax deduction.",v:["Permanent difference","No future reversal → no deferred tax"],cast:["pranav","diya"],en:"A penalty is recorded as an expense in the books but is permanently disallowed for tax. It will not become deductible in a later period. Because there is no future reversal, it changes the effective tax relationship but does not create deferred tax.",hi:"Penalty books में expense है, लेकिन tax में permanently disallowed है। वह future period में deduction नहीं बनेगी। Future reversal न होने के कारण यह effective tax relationship बदलती है, deferred tax नहीं बनाती।"},
{k:"Scene 3 · Timing difference",t:"The deduction moves between periods",c:"Different depreciation rates change when tax is paid, not the total underlying cost.",v:["Timing difference","Originates now → reverses later"],cast:["rolly","pranav"],en:"The machine has one depreciation charge in the financial statements and a faster deduction under tax law. The difference arises now but reverses over the asset’s life. This is a timing difference because it shifts taxable profit between periods.",hi:"Machine पर books में एक depreciation charge है और tax law में faster deduction है। Difference अभी arise होता है लेकिन asset की life में बाद में reverse होगा। इसलिए यह timing difference है, जो taxable profit को periods के बीच shift करता है।"},
{k:"Scene 4 · Deferred tax liability",t:"Lower tax today can mean tax later",c:"Tax depreciation exceeds book depreciation in the early years.",v:["Example","Timing difference ₹5 lakh × 30%","Deferred tax liability ₹1.5 lakh"],cast:["pranav","sethji"],en:"Because tax depreciation is higher today, taxable income and current tax are lower today. But the advantage reverses when tax depreciation becomes lower in later years. The future tax consequence is recognised now as a deferred tax liability of one point five lakh.",hi:"आज tax depreciation अधिक होने से taxable income और current tax कम है। लेकिन future years में tax depreciation कम होने पर यह benefit reverse होगा। इसलिए future tax consequence आज deferred tax liability, एक दशमलव पाँच लाख, के रूप में recognise होगा।"},
{k:"Scene 5 · Deferred tax asset",t:"A deduction may arrive later",c:"An expense recognised in books is allowed for tax only on payment.",v:["Example","Provision ₹4 lakh × 30%","Potential deferred tax asset ₹1.2 lakh"],cast:["diya","pranav"],en:"A qualifying expense is recognised in the books now but becomes tax deductible only when paid. Current taxable income is therefore higher, while a future deduction remains available. Subject to prudence and the applicable recognition test, that future tax benefit creates a deferred tax asset.",hi:"एक expense books में अभी recognise है, लेकिन tax deduction payment पर मिलेगी। इसलिए current taxable income अधिक है और future deduction available है। Prudence और applicable recognition test पूरा होने पर यह future benefit deferred tax asset बन सकता है।"},
{k:"Scene 6 · Prudence",t:"A deferred tax asset needs evidence",c:"Recognition depends on reasonable certainty; losses require the stricter applicable test.",v:["Recognition discipline","Do not recognise a tax benefit merely because it is mathematically possible"],cast:["sethji","pranav"],en:"Sethji wants every possible deferred tax asset because it improves net worth. Pranav applies prudence. A deferred tax asset is recognised only when the required certainty about future taxable income exists. Where unabsorbed depreciation or carried-forward tax losses are involved, the stricter evidence requirement must be satisfied.",hi:"सेठजी हर possible deferred tax asset recognise करना चाहते हैं क्योंकि net worth बढ़ती है। प्रणव prudence apply करते हैं। DTA तभी recognise होगा जब future taxable income के बारे में required certainty हो। Unabsorbed depreciation या carried-forward losses में अधिक कठोर evidence test पूरा करना आवश्यक है।"},
{k:"Scene 7 · Measurement",t:"Use the tax consequence expected on reversal",c:"Apply enacted or substantively enacted tax rates.",v:["Measurement","Timing difference × applicable tax rate"],cast:["rolly","pranav"],en:"Deferred tax is measured using the tax rates and laws enacted or substantively enacted by the balance sheet date and expected to apply when the timing difference reverses. The amount is not discounted simply because reversal will occur in later years.",hi:"Deferred tax को balance sheet date तक enacted या substantively enacted tax rates से measure किया जाता है, जो reversal के समय apply होने की expected हैं। केवल future reversal के कारण amount को discount नहीं किया जाता।"},
{k:"Scene 8 · Review and disclosure",t:"Deferred tax is not a set-and-forget number",c:"Review assets, recognise reversals and explain major components.",v:["Closing review","Opening balance + originations − reversals = closing deferred tax"],cast:["diya","pranav"],en:"At every balance sheet date, Diya reviews whether recognised deferred tax assets remain supportable and whether previously unrecognised assets now qualify. Originating and reversing timing differences are reconciled, and major components are disclosed so users can understand the future tax consequences.",hi:"हर balance sheet date पर दिया review करती हैं कि recognised DTA अभी भी supportable है या नहीं, और previously unrecognised asset अब qualify करता है या नहीं। Originating और reversing timing differences reconcile किए जाते हैं और major components disclose होते हैं।"},
{k:"Final recap",t:"Connect tax expense across periods",c:"Identify difference → decide whether it reverses → apply recognition test → measure and review.",v:["AS 22 chain","Permanent or timing? → DTL/DTA? → tax rate → review"],cast:["pranav","diya","sethji"],en:"The AS 22 method is disciplined. Reconcile accounting income with taxable income. Remove permanent differences from the deferred tax calculation. Track timing differences, recognise liabilities and qualifying assets, apply the appropriate tax rate, and review the balances every reporting date. Deferred tax connects tax consequences with the periods that create them.",hi:"AS 22 की method disciplined है। Accounting income और taxable income reconcile करें। Permanent differences को deferred tax calculation से बाहर रखें। Timing differences track करें, liabilities और qualifying assets recognise करें, appropriate tax rate apply करें और हर reporting date पर review करें।"}]}
};

function visualHTML(s){return `<div><strong>${s.v[0]}</strong><span>${s.v.slice(1).join("<br>")}</span></div>`}
function draw(){
 const s=story.scenes[index];$("#storyName").textContent=story.name;$("#counter").textContent=`${index+1} / ${story.scenes.length}`;$("#progress").style.width=`${(index+1)/story.scenes.length*100}%`;
 $("#kicker").textContent=s.k;$("#title").textContent=s.t;$("#caption").textContent=s.c;$("#visual").innerHTML=visualHTML(s);
 $("#cast").innerHTML=s.cast.map((who,i)=>`<div class="character c${i}">${avatar(who)}<label style="background:${COLORS[who]}">${NAMES[who]}</label></div>`).join("");
 frame.classList.toggle("playing",auto);
}
function currentNarration(){const s=story.scenes[index];return $("#lang").value==="hi-IN"?s.hi:s.en}
function loadVoices(){voices=speechSynthesis.getVoices();selectVoice()}
function selectVoice(){
 const lang=$("#lang").value.toLowerCase(),gender=$("#gender").value;let pool=voices.filter(v=>(v.lang||"").toLowerCase()===lang);
 if(!pool.length)pool=voices.filter(v=>(v.lang||"").toLowerCase().startsWith(lang.slice(0,2)));if(!pool.length)pool=voices;
 const female=/female|woman|heera|kalpana|neerja|swara|zira|aria|susan|hazel|veena/i,male=/male|man|ravi|hemant|madhur|david|mark|guy|george|prabhat/i;
 const v=gender==="female"?(pool.find(x=>female.test(x.name))||pool[0]):gender==="male"?(pool.find(x=>male.test(x.name))||pool[0]):pool[0];$("#voiceName").textContent=v?v.name:"Captions only";return v||null
}
function speak(){
 if(!("speechSynthesis"in window))return;speechSynthesis.cancel();speechSynthesis.resume();utterance=new SpeechSynthesisUtterance(currentNarration());const v=selectVoice();if(v)utterance.voice=v;
 utterance.lang=$("#lang").value;utterance.rate=utterance.lang==="hi-IN"?.9:.92;utterance.onend=()=>{if(auto)next()};speechSynthesis.speak(utterance);draw()
}
function next(){index=index<story.scenes.length-1?index+1:0;draw();if(auto)speak()}
function back(){index=Math.max(0,index-1);draw();if(auto)speak()}
$("#play").onclick=()=>{auto=true;frame.classList.add("playing");if(speechSynthesis.paused)speechSynthesis.resume();else speak()};
$("#pause").onclick=()=>{auto=false;frame.classList.remove("playing");if("speechSynthesis"in window)speechSynthesis.pause()};
$("#replay").onclick=()=>{auto=true;index=0;if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.resume()}draw();speak()};
$("#next").onclick=next;$("#back").onclick=back;$("#lang").onchange=$("#gender").onchange=()=>{auto=false;if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.resume()}selectVoice();draw()};
if("speechSynthesis"in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}addEventListener("pagehide",()=>speechSynthesis.cancel());draw();
